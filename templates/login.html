<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — InkFlow Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body style="padding-top: 5rem; display: flex; justify-content: center; align-items: center; min-height: 80vh;">
  
  <div style="background: var(--bg-card); padding: 3rem; border-radius: 24px; border: 1px solid var(--border-subtle); width: 100%; max-width: 400px; backdrop-filter: blur(16px);">
    <h2 style="text-align: center; margin-bottom: 2rem; color: white;">🔒 Acceso Restringido</h2>
    
    {% if error %}
      <p style="color: var(--accent); text-align: center; margin-bottom: 1rem; font-size: 0.9rem;">{{ error }}</p>
    {% endif %}

    <form method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
      <input type="text" name="usuario" placeholder="Usuario" required style="padding: 1rem; border-radius: 8px; border: 1px solid #333; background: #111; color: white;">
      <input type="password" name="contrasena" placeholder="Contraseña" required style="padding: 1rem; border-radius: 8px; border: 1px solid #333; background: #111; color: white;">
      
      <button type="submit" class="btn btn--primary" style="margin-top: 1rem;">Entrar al Panel</button>
    </form>
    
    <div style="text-align: center; margin-top: 2rem;">
      <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">← Volver al inicio</a>
    </div>
  </div>

</body>
</html>
