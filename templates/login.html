{% extends "base.html" %}
{% block title %}Login — InkFlow Admin{% endblock %}

{% block nav %}{% endblock %}

{% block content %}
<div class="ik-center">
  <div class="ik-card" style="width: 100%; max-width: 420px; padding: 3rem;">
    <div style="text-align: center; margin-bottom: 2.5rem;">
      <a href="/" class="ik-nav__logo" style="font-size: 2rem; display: inline-block; margin-bottom: 1rem;">Ink<span>Flow</span></a>
      <h2 style="font-size: 1.3rem; font-weight: 600; color: var(--text-main);">🔒 Acceso Restringido</h2>
    </div>

    <form method="POST" class="ik-form">
      <div>
        <label class="ik-label">Usuario</label>
        <input type="text" name="usuario" class="ik-input" placeholder="Tu usuario" required>
      </div>
      <div>
        <label class="ik-label">Contraseña</label>
        <input type="password" name="contrasena" class="ik-input" placeholder="Tu contraseña" required>
      </div>
      <button type="submit" class="ik-btn ik-btn--primary ik-btn--full" style="margin-top: 0.5rem;">Entrar al Panel</button>
    </form>

    <div style="text-align: center; margin-top: 2rem;">
      <a href="/" style="color: var(--text-muted); font-size: 0.9rem;">← Volver al inicio</a>
    </div>
  </div>
</div>
{% endblock %}
