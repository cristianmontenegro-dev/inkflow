{% extends "base.html" %}
{% block title %}Acceso — InkFlow{% endblock %}

{% block content %}
<div class="ik-narrow" style="padding-top: 3rem;">
  <form method="POST" action="/login" class="ik-form ik-auth">
    <div class="ik-auth__icon" aria-hidden="true">🔒</div>
    <h1>Panel de administrador</h1>
    <p>Ingresa tus credenciales para gestionar las citas.</p>

    <div class="ik-field">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario" class="ik-input" autocomplete="username" required autofocus>
    </div>
    <div class="ik-field">
      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="contrasena" class="ik-input" autocomplete="current-password" required>
    </div>

    <button type="submit" class="ik-btn ik-btn--primary ik-btn--block">Entrar</button>
  </form>
</div>
{% endblock %}
