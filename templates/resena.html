{% extends "base.html" %}
{% block title %}Deja tu Reseña — InkFlow{% endblock %}

{% block content %}
<div class="ik-center">
  <div class="ik-card" style="width: 100%; max-width: 500px; padding: 3rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="font-size: 1.4rem; font-weight: 700; color: var(--text-main);">⭐ Califica tu experiencia</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Tu opinión ayuda a otros a decidirse.</p>
    </div>

    <form method="POST" class="ik-form">
      <div>
        <label class="ik-label">Tu correo</label>
        <input type="email" name="email" class="ik-input" placeholder="Tu correo electrónico" required>
      </div>
      <div>
        <label class="ik-label">Calificación</label>
        <select name="estrellas" required class="ik-select">
          <option value="5">⭐⭐⭐⭐⭐ Excelente</option>
          <option value="4">⭐⭐⭐⭐ Muy bueno</option>
          <option value="3">⭐⭐⭐ Bueno</option>
          <option value="2">⭐⭐ Regular</option>
          <option value="1">⭐ Malo</option>
        </select>
      </div>
      <div>
        <label class="ik-label">Tu experiencia</label>
        <textarea name="comentario" class="ik-textarea" placeholder="Cuéntanos cómo fue tu experiencia..." required></textarea>
      </div>
      <button type="submit" class="ik-btn ik-btn--primary ik-btn--full" style="margin-top: 0.5rem;">Enviar Reseña</button>
    </form>

    <div style="text-align: center; margin-top: 2rem;">
      <a href="/" style="color: var(--text-muted); font-size: 0.9rem;">← Volver al inicio</a>
    </div>
  </div>
</div>
{% endblock %}
