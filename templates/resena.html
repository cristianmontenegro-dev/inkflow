{% extends "base.html" %}
{% block title %}Deja tu reseña — InkFlow{% endblock %}

{% block content %}
<div class="ik-narrow" style="padding-top: 2rem;">
  <form method="POST" action="/dejar-resena" class="ik-form ik-auth">
    <div class="ik-auth__icon" aria-hidden="true">⭐</div>
    <h1>Deja tu reseña</h1>
    <p>Tu opinión ayuda a otras personas a decidirse y a mí a seguir creciendo.</p>

    <div class="ik-field">
      <label>¿Cómo calificas tu experiencia?</label>
      <!-- Las estrellas van de 5 a 1 en el HTML; CSS las muestra de 1 a 5 -->
      <div class="ik-rate" role="radiogroup" aria-label="Calificación de 1 a 5 estrellas">
        <input type="radio" id="e5" name="estrellas" value="5" required><label for="e5" title="5 estrellas">★</label>
        <input type="radio" id="e4" name="estrellas" value="4"><label for="e4" title="4 estrellas">★</label>
        <input type="radio" id="e3" name="estrellas" value="3"><label for="e3" title="3 estrellas">★</label>
        <input type="radio" id="e2" name="estrellas" value="2"><label for="e2" title="2 estrellas">★</label>
        <input type="radio" id="e1" name="estrellas" value="1"><label for="e1" title="1 estrella">★</label>
      </div>
    </div>

    <div class="ik-field">
      <label for="email">Correo con el que reservaste</label>
      <input type="email" id="email" name="email" class="ik-input" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
    </div>

    <div class="ik-field">
      <label for="comentario">Tu comentario</label>
      <textarea id="comentario" name="comentario" class="ik-input" placeholder="Cuéntanos cómo fue tu experiencia" maxlength="500" required></textarea>
    </div>

    <button type="submit" class="ik-btn ik-btn--primary ik-btn--block">Publicar reseña</button>
  </form>
</div>
{% endblock %}
