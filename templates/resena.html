<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deja tu Reseña — InkFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body style="padding-top: 5rem; display: flex; justify-content: center; align-items: center; min-height: 80vh;">
  
  <!-- CONTENEDOR DE MENSAJES FLASH -->
  <div id="flash-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-message {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>

  <div style="background: var(--bg-card); padding: 3rem; border-radius: 24px; border: 1px solid var(--border-subtle); width: 100%; max-width: 500px; backdrop-filter: blur(16px);">
    <h2 style="text-align: center; margin-bottom: 1rem; color: white;">⭐ Califica tu experiencia</h2>
    <p style="color: var(--text-muted); text-align: center; margin-bottom: 2rem; font-size: 0.9rem;">Tu opinión ayuda a otros a decidirse.</p>

    <form method="POST" style="display: flex; flex-direction: column; gap: 1.5rem;">
      <input type="email" name="email" placeholder="Tu correo electrónico" required style="padding: 1rem; border-radius: 8px; border: 1px solid #333; background: #111; color: white;">
      
      <select name="estrellas" required style="padding: 1rem; border-radius: 8px; border: 1px solid #333; background: #111; color: white;">
        <option value="5">⭐⭐⭐⭐⭐ (Excelente)</option>
        <option value="4">⭐⭐⭐⭐ (Muy bueno)</option>
        <option value="3">⭐⭐⭐ (Bueno)</option>
        <option value="2">⭐⭐ (Regular)</option>
        <option value="1">⭐ (Malo)</option>
      </select>

      <textarea name="comentario" placeholder="Cuéntanos cómo fue tu experiencia..." required style="padding: 1rem; border-radius: 8px; border: 1px solid #333; background: #111; color: white; resize: vertical; min-height: 100px;"></textarea>
      
      <button type="submit" class="btn btn--primary" style="margin-top: 1rem;">Enviar Reseña</button>
    </form>
    
    <div style="text-align: center; margin-top: 2rem;">
      <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">← Volver al inicio</a>
    </div>
  </div>
</body>
</html>
