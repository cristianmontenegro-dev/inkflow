<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Reserva — InkFlow</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body style="padding-top: 5rem;">
  <div style="max-width: 500px; margin: 0 auto; padding: 2rem;">
    <h2 class="section-title" style="text-align: left;">✏️ Editar Reserva</h2>
    
    <form action="/editar/{{ reserva[0] }}" method="POST" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem;">
      <label style="color: white;">Nombre del cliente:</label>
      <input type="text" name="nombre" value="{{ reserva[1] }}" required style="padding: 1rem; border-radius: 8px; border: 1px solid #333; background: #111; color: white;">
      
      <label style="color: white;">Idea del tatuaje:</label>
      <input type="text" name="idea" value="{{ reserva[2] }}" required style="padding: 1rem; border-radius: 8px; border: 1px solid #333; background: #111; color: white;">
      
      <button type="submit" class="btn btn--primary" style="margin-top: 1rem;">Guardar Cambios</button>
      <a href="/admin" style="text-align: center; color: var(--text-muted); text-decoration: none;">Cancelar</a>
    </form>
  </div>
</body>
</html>
