{% extends "base.html" %}
{% block title %}Editar reserva — InkFlow{% endblock %}

{% block nav_links %}
  <li><a href="/admin">← Volver al panel</a></li>
{% endblock %}

{% block content %}
<div class="ik-narrow" style="width: min(560px, calc(100% - 2rem));">
  <div class="ik-panel-head">
    <div>
      <h1>Editar reserva</h1>
      <p>Reserva #{{ reserva[0] }}</p>
    </div>
  </div>

  <form method="POST" action="/editar/{{ reserva[0] }}" class="ik-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="ik-field">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" class="ik-input" value="{{ reserva[1] }}" required>
    </div>
    <div class="ik-field">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" class="ik-input" value="{{ reserva[2] }}" required>
    </div>
    <div class="ik-field">
      <label for="idea">Idea del tatuaje</label>
      <input type="text" id="idea" name="idea" class="ik-input" value="{{ reserva[3] }}" required>
    </div>
    <div class="ik-row">
      <div class="ik-field">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" name="fecha" class="ik-input" value="{{ reserva[4] }}" required>
      </div>
      <div class="ik-field">
        <label for="hora">Hora</label>
        <input type="time" id="hora" name="hora" class="ik-input" value="{{ reserva[5] }}" required>
      </div>
    </div>

    <div class="ik-row">
      <a href="/admin" class="ik-btn ik-btn--ghost">Cancelar</a>
      <button type="submit" class="ik-btn ik-btn--primary">Guardar cambios</button>
    </div>
  </form>
</div>
{% endblock %}
