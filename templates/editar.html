{% extends "base.html" %}
{% block title %}Editar Reserva — InkFlow{% endblock %}

{% block nav_links %}
<li><a href="/admin">Panel Admin</a></li>
{% endblock %}

{% block content %}
<div class="ik-narrow" style="padding-top: 6rem;">
  <h2 class="ik-title ik-title--left ik-title--sm">✏️ Editar Reserva</h2>

  <div class="ik-card" style="margin-top: 1.5rem;">
    <form action="/editar/{{ reserva[0] }}" method="POST" class="ik-form">
      <div>
        <label class="ik-label">Nombre del cliente</label>
        <input type="text" name="nombre" class="ik-input" value="{{ reserva[1] }}" required>
      </div>
      <div>
        <label class="ik-label">Email</label>
        <input type="email" name="email" class="ik-input" value="{{ reserva[2] }}" required>
      </div>
      <div>
        <label class="ik-label">Idea del tatuaje</label>
        <input type="text" name="idea" class="ik-input" value="{{ reserva[3] }}" required>
      </div>
      <div class="ik-form-row">
        <div>
          <label class="ik-label">Fecha</label>
          <input type="date" name="fecha" class="ik-input" value="{{ reserva[4] }}" required>
        </div>
        <div>
          <label class="ik-label">Hora</label>
          <input type="time" name="hora" class="ik-input" value="{{ reserva[5] }}" required>
        </div>
      </div>
      <button type="submit" class="ik-btn ik-btn--primary ik-btn--full" style="margin-top: 0.5rem;">Guardar Cambios</button>
      <a href="/admin" style="text-align: center; color: var(--text-muted); font-size: 0.9rem; display: block;">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
